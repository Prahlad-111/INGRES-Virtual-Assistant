<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - INGRES AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>INGRES AI</h1>
            <h2>Forgot Password?</h2>
            <p>Enter your registered email to reset your password.</p>

            <form id="forgot-password-form">
                <div class="form-group">
                    <label for="reset-email">Email Address</label>
                    <input
                        type="email"
                        id="reset-email"
                        name="email"
                        placeholder="Enter your registered email"
                        required
                    >
                </div>

                <button type="submit" id="send-reset-code">
                    Send Reset Code
                </button>
            </form>

            <p id="reset-message" role="status" aria-live="polite"></p>

            <form id="reset-password-form" hidden>
                <div class="form-group">
                    <label for="reset-otp">Email OTP</label>
                    <input
                        type="text"
                        id="reset-otp"
                        name="otp"
                        inputmode="numeric"
                        pattern="[0-9]{6}"
                        maxlength="6"
                        placeholder="Enter 6-digit code"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input
                        type="password"
                        id="new-password"
                        name="new_password"
                        minlength="6"
                        maxlength="72"
                        placeholder="Enter new password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm New Password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm_password"
                        minlength="6"
                        maxlength="72"
                        placeholder="Confirm new password"
                        required
                    >
                </div>

                <button type="submit" id="reset-password-button">
                    Reset Password
                </button>
            </form>

            <p><a href="/login">Back to Login</a></p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/forgot_password.js') }}"></script>
</body>
</html>
