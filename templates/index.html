<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>INGRES AI Virtual Assistant</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <!-- ==================================================
         MAIN CSS
         ================================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


<div class="app-container">


    <!-- ==================================================
         SIDEBAR
         ================================================== -->

    <aside
        id="sidebar"
        class="sidebar"
    >


        <!-- ==================================================
             SIDEBAR HEADER
             ================================================== -->

        <div class="sidebar-header">


            <div class="sidebar-title">

                <span class="sidebar-icon">
                    💬
                </span>

                <span>
                    Recent Chats
                </span>

            </div>


            <!-- Mobile Close Button -->

            <button
                id="close-sidebar-button"
                class="icon-button mobile-only"
                type="button"
                title="Close"
            >
                ✕
            </button>


        </div>



        <!-- ==================================================
             RECENT CHAT LIST
             ================================================== -->

        <div
            id="recent-chat-list"
            class="recent-chat-list"
        >

            <!--
                Recent chats are loaded
                automatically by script.js
            -->

        </div>



        <!-- ==================================================
             SIDEBAR FOOTER
             ================================================== -->

        <div class="sidebar-footer">


            <!-- ==================================================
                 ACCOUNT
                 ================================================== -->

            <div class="account-wrapper">


                <!-- Account Button -->

                <button
                    id="account-button"
                    class="account-button"
                    type="button"
                >

                    <span>
                        👤
                    </span>

                    <span id="account-name">
                        Account
                    </span>

                </button>



                <!-- ==================================================
                     ACCOUNT MENU
                     ================================================== -->

                <div
                    id="account-menu"
                    class="account-menu hidden"
                >


                    <!-- User Information -->

                    <div class="account-info">


                        <strong
                            id="account-display-name"
                        >
                            User
                        </strong>


                        <span
                            id="account-display-email"
                        >
                            user@email.com
                        </span>


                    </div>



                    <!-- Login With Another Account -->

                    <button
                        id="switch-account-button"
                        type="button"
                    >

                        🔄 Login with another account

                    </button>



                    <!-- Logout -->

                    <button
                        id="logout-button"
                        type="button"
                    >

                        🚪 Logout

                    </button>


                </div>


            </div>



            <!-- ==================================================
                 SIDEBAR FOOTER TEXT
                 ================================================== -->

            <div class="sidebar-footer-text">


                <span>
                    INGRES AI
                </span>


                <span>
                    Virtual Assistant
                </span>


            </div>


        </div>


    </aside>



    <!-- ==================================================
         MAIN CHAT
         ================================================== -->

    <main class="chat-container">



        <!-- ==================================================
             HEADER
             ================================================== -->

        <header class="chat-header">


            <!-- ==================================================
                 HEADER LEFT
                 ================================================== -->

            <div class="header-left">


                <!-- Mobile Sidebar Button -->

                <button
                    id="open-sidebar-button"
                    class="icon-button mobile-only"
                    type="button"
                    title="Recent Chats"
                >

                    ☰

                </button>



                <!-- Bot Avatar -->

                <div class="bot-avatar">

                    🤖

                </div>



                <!-- Header Information -->

                <div class="header-info">


                    <h2>
                        INGRES AI Assistant
                    </h2>


                    <div class="online-status">


                        <span class="online-dot"></span>


                        Online


                    </div>


                </div>


            </div>



            <!-- ==================================================
                 NEW CHAT
                 ================================================== -->

            <div class="new-chat-wrapper">


                <!-- New Chat Button -->

                <button
                    id="new-chat-button"
                    class="new-chat-button"
                    type="button"
                >

                    🗑️ New Chat

                </button>



                <!-- ==================================================
                     NEW CHAT MENU
                     ================================================== -->

                <div
                    id="new-chat-menu"
                    class="new-chat-menu hidden"
                >


                    <!-- Clear Chat -->

                    <button
                        id="clear-chat-button"
                        type="button"
                    >

                        🧹 Clear Chat

                    </button>



                    <!-- Clear Conversation Memory -->

                    <button
                        id="clear-memory-button"
                        type="button"
                    >

                        🧠 Clear Conversation Memory

                    </button>



                    <!-- Start Fresh -->

                    <button
                        id="start-fresh-button"
                        type="button"
                    >

                        ✨ Start Fresh

                    </button>


                </div>


            </div>


        </header>



        <!-- ==================================================
             CHAT BOX
             ================================================== -->

        <div
            id="chat-box"
            class="chat-box"
        >


            <!-- ==================================================
                 INITIAL WELCOME MESSAGE
                 ================================================== -->

            <div class="message bot-message">


                <!-- Bot Icon -->

                <div class="message-icon">

                    🤖

                </div>



                <!-- Message Content -->

                <div class="message-content">


                    <!-- Name -->

                    <div class="message-name">

                        INGRES Assistant

                    </div>



                    <!-- Message -->

                    <div class="message-text">


                        <p>

                            Hello! 👋

                        </p>


                        <p>

                            Welcome to the

                            <strong>
                                INGRES AI Virtual Assistant
                            </strong>.

                        </p>


                        <p>

                            How can I help you today?

                        </p>


                    </div>


                </div>


            </div>


        </div>



        <!-- ==================================================
             TYPING INDICATOR
             ================================================== -->

        <div
            id="typing"
            class="typing-container hidden"
        >


            <!-- Bot Icon -->

            <div class="message-icon">

                🤖

            </div>



            <!-- Typing Content -->

            <div class="typing-content">


                <div class="message-name">

                    INGRES Assistant

                </div>



                <div class="typing-bubble">


                    <span></span>

                    <span></span>

                    <span></span>


                </div>


            </div>


        </div>



        <!-- ==================================================
             INPUT AREA
             ================================================== -->

        <div class="chat-input-area">


            <!-- User Input -->

            <input
                type="text"
                id="user-input"
                placeholder="Ask anything..."
                autocomplete="off"
            >



            <!-- Send Button -->

            <button
                id="send-button"
                type="button"
            >

                Send

            </button>


        </div>


    </main>


</div>



<!-- ==================================================
     JAVASCRIPT
     ================================================== -->

<script
    src="{{ url_for('static', filename='js/script.js') }}"
    defer
></script>


</body>

</html>
